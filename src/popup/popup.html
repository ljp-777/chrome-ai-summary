<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { width: 280px; padding: 12px; font: 13px system-ui, sans-serif; }
    h1 { font-size: 14px; margin-bottom: 10px; }
    .modes { display: flex; gap: 4px; margin-bottom: 10px; }
    .modes label { flex: 1; }
    .modes input { display: none; }
    .modes span {
      display: block; padding: 4px 0; text-align: center;
      border: 1px solid #dadce0; border-radius: 4px; cursor: pointer; font-size: 11px;
    }
    .modes input:checked + span { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    textarea {
      width: 100%; min-height: 64px; max-height: 100px; padding: 8px;
      border: 1px solid #dadce0; border-radius: 4px; resize: vertical; font: inherit;
      margin-bottom: 10px;
    }
    textarea::placeholder { color: #9aa0a6; font-size: 12px; }
    #summarize {
      width: 100%; padding: 9px; background: #1a73e8; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    #summarize:hover { background: #1557b0; }
    .footer { margin-top: 10px; text-align: center; font-size: 12px; }
    .footer a { color: #1a73e8; text-decoration: none; cursor: pointer; }
    .footer span { color: #dadce0; margin: 0 6px; }
  </style>
</head>
<body>
  <h1>AI 总结</h1>
  <div class="modes">
    <label><input type="radio" name="mode" value="brief" checked /><span>精简</span></label>
    <label><input type="radio" name="mode" value="detail" /><span>详细</span></label>
    <label><input type="radio" name="mode" value="bullet" /><span>要点</span></label>
    <label><input type="radio" name="mode" value="insight" /><span>观点</span></label>
  </div>
  <textarea id="pasteText" placeholder="粘贴微信/剪贴板文字，留空则用页面选中内容"></textarea>
  <button id="summarize">总结</button>
  <div class="footer">
    <a id="summarizePage">整页总结</a>
    <span>|</span>
    <a id="openOptions">设置</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
